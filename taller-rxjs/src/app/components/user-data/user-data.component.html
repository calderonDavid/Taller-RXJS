<!-- Solo mostramos la tarjeta si la variable user tiene datos -->
<div class="row justify-content-center" *ngIf="user">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
      <div class="row g-0">
        <!-- Columna para la imagen (Ocupa un tercio del ancho) -->
        <div class="col-md-4 bg-light d-flex align-items-center justify-content-center p-3">
          <img 
            [src]="user.image" 
            [alt]="'Foto de perfil de ' + user.firstName"
            class="img-fluid rounded-circle border border-3 border-white shadow-sm"
            style="max-width: 120px;">
        </div>
        
        <!-- Columna para los datos (Ocupa dos tercios del ancho) -->
        <div class="col-md-8">
          <div class="card-body py-4">
            <h4 class="card-title text-primary mb-1 fw-bold">
              {{ user.firstName }} {{ user.lastName }}
            </h4>
            <p class="card-text text-muted mb-3">
              <i class="bi bi-person-badge me-2"></i> {{ '@' + user.username }}
            </p>
            
            <ul class="list-group list-group-flush">
              <li class="list-group-item px-0 pb-1 pt-2 border-0">
                <i class="bi bi-envelope-at text-secondary me-2"></i> 
                <strong>Email:</strong> {{ user.email }}
              </li>
              <!-- Puedes agregar más datos principales aquí usando la misma estructura <li> -->
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
