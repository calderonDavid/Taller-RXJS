<div class="container my-5">
  <h2 class="text-center mb-4 text-primary">Red Social DummyJSON</h2>

  <!-- Sección 1: Barra de búsqueda -->
  <div class="row justify-content-center mb-4">
    <div class="col-md-6">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
        <input 
          type="text" 
          class="form-control" 
          placeholder="Buscar por username (ej: emilys, atuny0)..." 
          [(ngModel)]="usernameToSearch"
          (keyup.enter)="buscarUsuario()">
        <button class="btn btn-primary" type="button" (click)="buscarUsuario()">
          Buscar
        </button>
      </div>
    </div>
  </div>

  <!-- Mensaje de error si el usuario no existe -->
  <div class="row justify-content-center" *ngIf="errorMessage">
    <div class="col-md-6 text-center">
      <div class="alert alert-danger shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ errorMessage }}
      </div>
    </div>
  </div>

  <!-- Contenedor principal: Solo se muestra si el usuario existe y no hay errores -->
  <div *ngIf="user && !errorMessage">
    
    <!-- Sección 2: Componente de Datos de Usuario -->
    <app-user-data [user]="user"></app-user-data>

    <hr class="my-5 border-secondary">

    <!-- Sección 3: Componente de Posts del Usuario -->
    <app-user-posts 
      [posts]="posts" 
      [commentsByPost]="commentsByPost">
    </app-user-posts>
    
  </div>
</div>
